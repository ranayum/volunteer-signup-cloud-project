<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Garden Workday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"

    />
    <link rel="stylesheet" href="styles.css" />

  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          Volunteers
          <span class="brand-tag">Find a role. Pick a time. Show up.</span>
        </div>
        <div class="header-actions">
          <a class="btn btn-primary" href="create.html">Create event</a>
        </div>
      </header>

      <article class="panel detail-panel">
        <header class="detail-header">
          <h1 class="detail-title">Community Garden Workday</h1>
          <p class="event-date">Saturday, April 12</p>
          <p class="detail-copy">
            Help tend beds, welcome neighbors, and keep the garden ready for
            spring planting.
          </p>
        </header>

        <h2 class="section-label">Roles</h2>
        <ul class="choice-list">
          <li>
            <a class="choice" href="role.html">Setup Crew</a>
          </li>
          <li>
            <a class="choice" href="role.html">Garden Guide</a>
          </li>
          <li>
            <a class="choice" href="role.html">Refreshments</a>
          </li>
          <li>
            <a class="choice" href="role.html">Cleanup</a>
