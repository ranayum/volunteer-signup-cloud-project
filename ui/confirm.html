<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm enlistment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          Volunteers
          <span class="brand-tag">Find a role. Pick a time. Show up.</span>
        </div>
        <div class="header-actions">
          <a class="btn btn-primary" href="event.html">All events</a>
          <a class="btn btn-primary" href="create.html">Create event</a>
        </div>
      </header>

      <div class="create-form">
        <div class="create-box">
          <p class="confirm-prompt">
            Confirm your enlistment
          </p>

          <div class="field">
            <label for="volunteer-name">Your name</label>
            <input
              id="volunteer-name"
              name="name"
              type="text"
              value=""
              autocomplete="off"
            />
          </div>
        </div>

        <div class="create-actions">
          <button class="btn btn-primary" type="button">Submit</button>
        </div>
      </div>
    </div>
  </body>
</html>
